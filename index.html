<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="EcoCal · 个人资产持仓记录工具（本地离线，多币种，收益率/年化统计与可视化）">
<title>EcoCal · 资产持仓记录</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">EcoCal <span class="brand-sub">资产持仓记录</span><span class="version-tag" id="app-version"></span></div>
    <div class="top-actions">
      <button id="btn-help" class="btn btn-ghost">帮助</button>
      <button id="btn-import" class="btn btn-ghost">导入</button>
      <button id="btn-export" class="btn btn-ghost">导出</button>
      <button id="btn-settings" class="btn btn-ghost">设置</button>
      <button id="btn-add" class="btn btn-primary">＋ 添加产品</button>
    </div>
  </div>
</header>

<main class="container">
  <!-- 主界面分页：产品 / 统计 -->
  <nav class="tabs" id="main-tabs" role="tablist">
    <button type="button" class="tab active" data-tab="assets" role="tab">产品</button>
    <button type="button" class="tab" data-tab="stats" role="tab">统计</button>
  </nav>

  <!-- 统计面板：汇总 + 图表（独立于产品列表） -->
  <section class="tab-panel hidden" id="panel-stats" role="tabpanel">
    <!-- 汇总区 -->
    <section class="summary-grid" id="summary-grid"></section>
    <div class="currency-subtotals" id="currency-subtotals"></div>

    <!-- 图表区 -->
    <section class="charts-grid">
      <div class="card">
        <h2>资产结构（基准币种）</h2>
        <div class="dim-toggle" id="ring-dims">
          <button type="button" data-dim="category" class="active">按类别</button>
          <button type="button" data-dim="currency">按币种</button>
          <button type="button" data-dim="risk">按风险等级</button>
        </div>
        <div class="chart-box" id="ring-chart"></div>
        <div class="hint" style="margin-top:6px;font-size:11px;color:var(--ink-3)">点击环图切片可筛选「产品」列表。</div>
      </div>
      <div class="card">
        <h2>市值排行 · 按产品</h2>
        <div class="chart-box" id="bar-chart"></div>
        <div class="hint" style="margin-top:6px;font-size:11px;color:var(--ink-3)">点击条形图可只看该产品，再次点击取消。</div>
      </div>
      <div class="card">
        <h2>组合市值走势（估算）</h2>
        <div class="chart-box" id="trend-chart"></div>
      </div>
      <div class="card">
        <h2>盈亏构成</h2>
        <div class="chart-box" id="profit-chart"></div>
      </div>
    </section>
  </section>

  <!-- 产品面板：筛选 + 列表 -->
  <section class="tab-panel" id="panel-assets" role="tabpanel">
    <!-- 筛选栏 -->
    <section class="filter-bar">
      <span class="filter-label">筛选：</span>
      <select id="filter-category" title="按类别筛选"></select>
      <select id="filter-currency" title="按币种筛选"></select>
      <span class="sep"></span>
      <span class="filter-label">排序：</span>
      <select id="filter-sort" title="排序方式"></select>
    </section>

    <!-- 图表点击筛选状态条 -->
    <section class="filter-bar hidden" id="chart-filter-bar">
      <span class="filter-label" id="chart-filter-text"></span>
      <button id="chart-filter-clear" class="btn btn-mini ghost">✕ 清除图表筛选</button>
    </section>

    <!-- 产品列表 -->
    <section class="asset-list" id="asset-list"></section>

    <!-- 空状态 -->
    <section class="empty-state hidden" id="empty-state">
      <div class="icon">📈</div>
      <h3>还没有任何持仓记录</h3>
      <p>点击「＋ 添加产品」记录你的第一笔资产（股票只需填代码即可加入监察表；基金、债券、存款、外币等填写基本信息）。所有买卖通过卡片上的「＋ 买入 / − 卖出」逐笔记录，工具自动计算收益率与年化。数据仅保存在本机浏览器中。</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button id="empty-add" class="btn btn-primary">＋ 添加产品</button>
      </div>
    </section>
  </section>
</main>

<!-- 通用表单模态框 -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button id="modal-close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button id="modal-cancel" class="btn btn-ghost">取消</button>
      <button id="modal-ok" class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-backdrop hidden" id="confirm-backdrop">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><h3 id="confirm-title">确认操作</h3><button id="confirm-close" aria-label="关闭">✕</button></div>
    <div class="modal-body"><div class="confirm-text" id="confirm-text"></div></div>
    <div class="modal-footer">
      <button id="confirm-cancel" class="btn btn-ghost">取消</button>
      <button id="confirm-ok" class="btn btn-danger">确认</button>
    </div>
  </div>
</div>

<input type="file" id="import-input" accept="application/json,.json" class="hidden">

<script src="js/app.js"></script>
</body>
</html>
